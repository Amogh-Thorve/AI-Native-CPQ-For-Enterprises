services:
  db:
    image: postgres:16-alpine
    container_name: cpq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpq_user
      POSTGRES_PASSWORD: cpq_password
      POSTGRES_DB: cpq_db
    ports:
      - "5432:5432"
    volumes:
      - cpq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpq_user -d cpq_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cpq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides backend/.env inside the container: point at the db service, not localhost.
      DATABASE_URL: postgresql+asyncpg://cpq_user:cpq_password@db:5432/cpq_db
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cpq_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Read by the browser, so it must be the host-facing URL.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  cpq_postgres_data:
    driver: local
